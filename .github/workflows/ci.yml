name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. The default token can write to the repository; this build only
# reads it. Narrowing permissions means a compromised dependency or action cannot
# push commits, and it costs nothing to declare.
permissions:
  contents: read

# Cancel an in-progress run when new commits land on the same branch. Nobody
# needs the results of a commit that has already been superseded, and CI minutes
# spent on stale code are minutes a real run is queued behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # A hung Testcontainers start would otherwise burn the full six-hour default.
    timeout-minutes: 25

    # Secrets are not available in job-level `if:`, so they are lifted into env
    # here and the steps below check env instead. This is what lets the quality
    # steps skip cleanly on a repository that has not configured them yet,
    # instead of failing and turning the badge red.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone. SonarQube Cloud uses git blame to
          # attribute issues to authors and to work out which lines are "new
          # code" for the quality gate; a depth-1 clone leaves it blind to both.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2 keyed on pom.xml. Without it every run re-downloads the
          # dependency tree, which on this project is several minutes per run.
          cache: maven

      - name: Build and test
        # `verify`, not `test`: verify runs the full lifecycle including the
        # JaCoCo report, so coverage exists for the artifact upload below.
        #
        # Testcontainers works here because ubuntu-latest runners ship a running
        # Docker daemon. The integration tests genuinely start PostgreSQL 16 -
        # the concurrency and idempotency tests are meaningless otherwise, so
        # this is not a formality.
        run: ./mvnw -B verify

      - name: Upload test and coverage reports
        # `always()` matters. Without it this step is skipped when the build
        # fails - which is exactly when the reports are worth reading. A CI run
        # that discards its evidence on failure makes you re-run locally to learn
        # what it already knew.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

      # Static analysis. Skipped entirely until SONAR_TOKEN is configured, so a
      # fork or a fresh clone still gets a green build.
      #
      # Runs after `verify` on purpose: Sonar reads the JaCoCo report produced by
      # that step. Run it before the tests and coverage shows as 0%, which then
      # fails a "coverage on new code" gate for no real reason.
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Snyk scans the resolved dependency tree for known vulnerabilities.
      #
      # This is the check that catches the thing you did not write: a transitive
      # dependency four levels down with a published CVE. Nothing in the test
      # suite can find that, because the code is correct - the library is not.
      #
      # --severity-threshold=high so the build is not blocked by low-severity
      # findings in test-only dependencies. Worth revisiting: the right threshold
      # depends on how much noise the team will actually triage rather than learn
      # to ignore.
      - name: Snyk dependency scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/maven@master
        with:
          args: --severity-threshold=high --file=pom.xml

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    # Only after tests pass. Building an image from unverified code wastes time
    # at best, and at worst produces something someone is tempted to run.
    needs: build
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Not pushed anywhere. Building proves the Dockerfile is valid and the
          # image assembles; publishing needs a registry and credentials, which
          # is a deployment concern rather than a CI one.
          push: false
          tags: claims-service:${{ github.sha }}
          # Persist Docker layer cache between runs, so an unchanged dependency
          # layer is not rebuilt every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
